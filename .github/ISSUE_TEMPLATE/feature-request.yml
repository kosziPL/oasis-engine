name: Oasis Engine feature request
description: Suggest an engine improvement for players, mod creators, or developers.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete use case in Oasis Engine.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples and compatibility
      description: Include examples, sketches, or effects on existing charts and mods if relevant.
