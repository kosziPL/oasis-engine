name: Oasis Engine documentation
description: Report missing, outdated, or unclear engine documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or topic
      description: Provide the document path, section, or public URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: Include the engine version and what you expected the guide to explain.
    validations:
      required: true
